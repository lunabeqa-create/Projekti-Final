<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eastern Illuminations | Serene Wisdom Library</title>
    <style>
        /* -------------------------------
           ZEN ATMOSPHERE — EASTERN HARMONY
        ------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #1f2a1e, #0f120c);
            font-family: "Cormorant Garamond", "Georgia", "Times New Roman", serif;
            color: #201e12;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        /* bamboo forest whisper effect (pure css) */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(90deg, 
                rgba(80, 100, 50, 0.02) 0px, 
                rgba(80, 100, 50, 0.02) 3px,
                transparent 3px,
                transparent 25px),
                repeating-linear-gradient(0deg,
                rgba(60, 45, 30, 0.03) 0px,
                rgba(60, 45, 30, 0.03) 2px,
                transparent 2px,
                transparent 40px);
            pointer-events: none;
            z-index: 0;
        }

        /* drifting lantern particles */
        body::after {
            content: "☯  🎋  🏮  ✨  🍃";
            position: fixed;
            bottom: 15px;
            left: -80px;
            font-size: 42px;
            white-space: nowrap;
            color: rgba(210, 180, 110, 0.08);
            pointer-events: none;
            animation: floatLantern 45s linear infinite;
            z-index: 0;
            font-family: monospace;
        }

        @keyframes floatLantern {
            0% { transform: translateX(-10%) translateY(0px) rotate(0deg); opacity: 0.1; }
            50% { transform: translateX(35%) translateY(-20px) rotate(5deg); opacity: 0.25; }
            100% { transform: translateX(85%) translateY(-10px) rotate(-3deg); opacity: 0.1; }
        }

        /* main library — rice paper texture with ink wash */
        .library {
            position: relative;
            z-index: 10;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            background: #fef7e8;
            background-image: radial-gradient(circle at 10% 20%, rgba(160, 130, 80, 0.08) 1.5px, transparent 1.5px),
                              linear-gradient(165deg, #fff8eb 0%, #f5ecda 100%);
            background-size: 32px 32px, 100%;
            border-radius: 48px 24px 48px 24px;
            box-shadow: 0 25px 40px -12px rgba(0,0,0,0.4),
                        0 0 0 1px #e4cdac inset,
                        0 0 0 6px #776b4b inset,
                        0 0 0 12px #c8b28b inset;
            padding: 2.2rem 2rem 2.2rem 2rem;
            transition: all 0.3s ease;
        }

        .library:hover {
            transform: translateY(-3px);
            box-shadow: 0 30px 45px -15px rgba(0,0,0,0.5);
        }

        /* ink wash seal stamp effect */
        .library::before {
            content: "🖌️ 印";
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 1rem;
            font-family: monospace;
            color: #b57c48;
            background: #f3e7d3;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            opacity: 0.65;
            rotate: -8deg;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: inset 0 0 0 1px #efdabc, 0 1px 2px rgba(0,0,0,0.1);
            pointer-events: none;
        }

        /* Header: Zen Calligraphy */
        .header {
            text-align: center;
            margin-bottom: 2.2rem;
            padding-bottom: 0.8rem;
            position: relative;
            border-bottom: 1px solid #cfbc96;
        }

        .header h1 {
            font-size: 2.7rem;
            font-weight: 600;
            background: linear-gradient(135deg, #4a3b28, #8b6f42, #4f3e28);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 1px;
            display: inline-block;
            font-family: "Cormorant Garamond", "Georgia", serif;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.05);
            position: relative;
        }

        /* decorative elements - zen circle & wave */
        .header h1::before {
            content: "◯";
            font-size: 2.4rem;
            position: absolute;
            left: -55px;
            top: -2px;
            opacity: 0.35;
            color: #ab8a54;
            font-weight: 300;
        }

        .header h1::after {
            content: "～";
            font-size: 2rem;
            position: absolute;
            right: -45px;
            top: 8px;
            opacity: 0.4;
            color: #ad8f60;
            transform: rotate(15deg);
        }

        .header p {
            font-size: 1.1rem;
            font-style: italic;
            color: #5d4a31;
            background: rgba(200, 180, 140, 0.25);
            display: inline-block;
            padding: 0.35rem 1.8rem;
            border-radius: 60px;
            margin-top: 0.7rem;
            backdrop-filter: blur(2px);
            border-left: 1px solid #dbbf8c;
            border-right: 1px solid #dbbf8c;
            font-weight: 500;
        }

        /* BOOKS — elegant scroll with subtle east asian aesthetic */
        .books {
            margin: 2rem 0 2.2rem;
            position: relative;
        }

        .books ul {
            list-style: none;
            padding: 0.5rem 0.2rem;
            background: #fffbf0;
            border-radius: 32px 12px 32px 12px;
            box-shadow: inset 0 0 0 2px #fef0db, 0 8px 18px rgba(0,0,0,0.08);
        }

        .books li {
            font-size: 1.32rem;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            margin: 0.6rem 1rem;
            background: #fffff5;
            border-radius: 30px 8px 30px 8px;
            font-weight: 500;
            color: #3d2e1c;
            transition: all 0.25s ease;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.7rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04), inset 0 1px 0 #fffcf0;
            border-left: 5px solid #c2a166;
            cursor: pointer;
            position: relative;
        }

        /* ink brush icon before each title */
        .books li::before {
            content: "✍️";
            font-size: 1.3rem;
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.65;
            transition: 0.2s;
            filter: drop-shadow(0 0 1px #8b6942);
        }

        /* custom icons for each wisdom book */
        .books li:nth-child(1)::before { content: "⚔️"; font-size: 1.2rem; }
        .books li:nth-child(2)::before { content: "📜"; }
        .books li:nth-child(3)::before { content: "🌸"; }
        .books li:nth-child(4)::before { content: "🕊️"; }

        /* show author in elegant japanese/korean inspired badge */
        .books li::after {
            content: attr(data-author);
            font-size: 0.72rem;
            font-weight: normal;
            background: #e5d6be;
            padding: 0.2rem 0.9rem;
            border-radius: 50px;
            color: #5c462e;
            font-family: "Courier New", monospace;
            letter-spacing: 0.4px;
            border: 1px solid #dbbc8c;
            white-space: nowrap;
        }

        /* set custom authors with eastern/world wisdom */
        .books li:nth-child(1)::after { content: "Sun Tzu — 孙子"; }
        .books li:nth-child(2)::after { content: "Confucius — 孔子"; }
        .books li:nth-child(3)::after { content: "Murasaki Shikibu — 紫式部"; }
        .books li:nth-child(4)::after { content: "García Márquez — magical realism"; }

        /* hover effect: like a brush stroke highlight */
        .books li:hover {
            transform: translateX(8px);
            background: #fffdf3;
            border-left-color: #e6b45e;
            box-shadow: 0 6px 14px rgba(100, 70, 30, 0.12);
        }

        .books li:hover::before {
            opacity: 1;
            transform: translateY(-50%) scale(1.05);
        }

        /* footer — back link with bamboo touch */
        footer {
            text-align: center;
            margin-top: 2rem;
            position: relative;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #39402a;
            color: #f6edda;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.7rem 2rem;
            border-radius: 60px 12px 60px 12px;
            transition: all 0.3s;
            letter-spacing: 1px;
            border: 1px solid #b69264;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            font-family: "Cormorant Garamond", monospace;
        }

        .back:hover {
            background: #4e5a38;
            transform: translateY(-2px) scale(1.02);
            gap: 16px;
            border-radius: 12px 60px 12px 60px;
            border-color: #eac489;
            box-shadow: 0 8px 18px rgba(0,0,0,0.25);
        }

        /* adding oriental wave pattern inside library */
        .library::after {
            content: "🌊";
            font-size: 1.2rem;
            position: absolute;
            top: -15px;
            left: 20px;
            opacity: 0.4;
            animation: softWave 3s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes softWave {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-3px) rotate(5deg); opacity: 0.6; }
        }

        /* small koi / spirit detail */
        .books ul::after {
            content: "🐟";
            position: absolute;
            bottom: -28px;
            right: 15px;
            font-size: 1.1rem;
            opacity: 0.3;
            transition: 0.2s;
        }

        .books:hover ul::after {
            opacity: 0.6;
            transform: translateX(5px);
        }

        /* responsive design — flows like water */
        @media (max-width: 600px) {
            .library {
                padding: 1.3rem;
            }
            .header h1 {
                font-size: 1.9rem;
            }
            .header h1::before {
                font-size: 1.6rem;
                left: -35px;
                top: 2px;
            }
            .header h1::after {
                font-size: 1.5rem;
                right: -32px;
            }
            .books li {
                font-size: 1rem;
                padding: 0.7rem 0.8rem 0.7rem 2rem;
            }
            .books li::after {
                font-size: 0.6rem;
                white-space: normal;
            }
            .back {
                padding: 0.5rem 1.3rem;
            }
            .library::before {
                font-size: 0.7rem;
                bottom: 12px;
                right: 12px;
            }
        }

        /* ink drop subtle animation on title */
        @keyframes inkBloom {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 0%; }
        }

        .header h1 {
            background-size: 200% auto;
            animation: inkBloom 6s linear infinite alternate;
        }

        /* meditation glow while hovering book list */
        .books ul:hover {
            background: #fffef7;
            transition: 0.2s;
        }

        /* scrollbar like bamboo */
        ::-webkit-scrollbar {
            width: 6px;
            background: #2e2b1f;
        }
        ::-webkit-scrollbar-thumb {
            background: #b68b54;
            border-radius: 20px;
        }
    </style>
    <title>Eastern Illuminations | Serene Wisdom Library</title>
</head>
<body>
<div class="library">

    <div class="header">
        <h1>☯️ Eastern Illuminations</h1>
        <p>Foundations of timeless thought</p>
    </div>

    <div class="books">
        <ul>
            <li data-author="Sun Tzu">The Art of War</li>
            <li data-author="Confucius">Confucian Analects</li>
            <li data-author="Murasaki Shikibu">The Tale of Genji</li>
            <li data-author="Gabriel García Márquez">One Hundred Years of Solitude</li>
        </ul>
    </div>

    <footer>
        <a href="Index.html" class="back">← Back to Library</a>
    </footer>

</div>
</body>
</html>
