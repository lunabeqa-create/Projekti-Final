<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elysian Classics | Marble Hall of Wisdom</title>
<style>
    /* ------------------------------
       ELYSIAN / CLASSICAL REVIVAL
       Marble, laurel, timeless elegance
    ------------------------------- */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: radial-gradient(circle at 20% 30%, #1a1917, #0b0a08);
        font-family: "Cormorant Garamond", "Georgia", "Times New Roman", serif;
        color: #2c241a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        position: relative;
    }

    /* Marble veining texture overlay (classical grandeur) */
    body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: repeating-linear-gradient(105deg, 
            rgba(210, 195, 165, 0.02) 0px,
            rgba(210, 195, 165, 0.02) 2px,
            transparent 2px,
            transparent 18px),
            repeating-linear-gradient(25deg,
            rgba(150, 130, 90, 0.015) 0px,
            rgba(150, 130, 90, 0.015) 1px,
            transparent 1px,
            transparent 22px);
        pointer-events: none;
        z-index: 0;
    }

    /* floating golden dust / olympian particles */
    body::after {
        content: "✨ 🏛️ ✨ 🏺 ✨";
        position: fixed;
        top: 5%;
        right: -60px;
        font-size: 55px;
        white-space: nowrap;
        color: rgba(210, 180, 110, 0.08);
        pointer-events: none;
        animation: driftOlympus 38s infinite linear;
        z-index: 0;
    }

    @keyframes driftOlympus {
        0% { transform: translateX(-20%) rotate(0deg); opacity: 0.1; }
        50% { transform: translateX(35%) rotate(4deg); opacity: 0.2; }
        100% { transform: translateX(80%) rotate(0deg); opacity: 0.1; }
    }

    /* main library card — marble temple portico */
    .library {
        position: relative;
        z-index: 10;
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
        background: #fef7e9;
        background-image: radial-gradient(circle at 80% 30%, rgba(200, 180, 140, 0.1) 1.2px, transparent 1.2px);
        background-size: 28px 28px;
        border-radius: 32px 32px 48px 48px;
        box-shadow: 0 30px 40px -12px rgba(0,0,0,0.5),
                    0 0 0 1px #e7d5b5 inset,
                    0 0 0 6px #bc9f6e inset,
                    0 0 0 12px #efe0c1 inset;
        padding: 2.2rem 2rem 2.2rem 2rem;
        transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .library:hover {
        transform: translateY(-5px);
        box-shadow: 0 35px 50px -15px rgba(0,0,0,0.6);
    }

    /* Corinthian-like column decorations */
    .library::before {
        content: "🏛️";
        position: absolute;
        top: -20px;
        left: 30px;
        font-size: 2rem;
        opacity: 0.5;
        filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
        pointer-events: none;
    }

    .library::after {
        content: "🏺";
        position: absolute;
        bottom: -20px;
        right: 35px;
        font-size: 2rem;
        opacity: 0.4;
        pointer-events: none;
        transform: rotate(10deg);
    }

    /* Header — Golden Age Typography */
    .header {
        text-align: center;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid #dac29c;
        position: relative;
    }

    .header h1 {
        font-size: 2.9rem;
        font-weight: 700;
        background: linear-gradient(135deg, #5f4a2e, #b8884a, #6b4f2e);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        letter-spacing: 1.5px;
        display: inline-block;
        font-family: "Cormorant Garamond", "Georgia", serif;
        text-shadow: 3px 3px 12px rgba(0,0,0,0.08);
        position: relative;
    }

    /* laurel wreath effect */
    .header h1::before {
        content: "🌿";
        font-size: 2rem;
        position: absolute;
        left: -55px;
        top: 0px;
        opacity: 0.6;
        transform: rotate(-15deg);
    }

    .header h1::after {
        content: "🌿";
        font-size: 2rem;
        position: absolute;
        right: -55px;
        top: 0px;
        opacity: 0.6;
        transform: rotate(15deg);
    }

    .header p {
        font-size: 1.15rem;
        font-style: italic;
        color: #6f5639;
        background: rgba(215, 190, 145, 0.25);
        display: inline-block;
        padding: 0.3rem 2rem;
        border-radius: 60px;
        margin-top: 0.8rem;
        backdrop-filter: blur(2px);
        border-top: 1px solid #ebd5af;
        border-bottom: 1px solid #ebd5af;
        letter-spacing: 0.5px;
    }

    /* BOOKS — marble tablets */
    .books {
        margin: 2rem 0 2rem;
        position: relative;
    }

    .books ul {
        list-style: none;
        padding: 0.6rem 0.2rem;
        background: #fffcf3;
        border-radius: 24px 48px 24px 48px;
        box-shadow: inset 0 0 0 1px #f9efdf, 0 8px 20px rgba(0,0,0,0.08);
    }

    .books li {
        font-size: 1.36rem;
        padding: 0.9rem 1rem 0.9rem 3rem;
        margin: 0.7rem 1rem;
        background: #fffff7;
        border-radius: 50px 12px 50px 12px;
        font-weight: 600;
        color: #2f281c;
        transition: all 0.25s ease;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.7rem;
        box-shadow: 0 2px 6px rgba(0,0,0,0.04), inset 0 1px 0 #fffcf0;
        border-left: 6px solid #c7a16b;
        cursor: pointer;
        position: relative;
        font-family: "Cormorant Garamond", serif;
    }

    /* classical icons before each title */
    .books li::before {
        content: "🏺";
        font-size: 1.4rem;
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.7;
        transition: 0.2s;
    }

    /* specific classical symbols for each timeless work */
    .books li:nth-child(1)::before { content: "⚔️"; font-size: 1.3rem; }
    .books li:nth-child(2)::before { content: "🏛️"; }
    .books li:nth-child(3)::before { content: "📜"; }
    .books li:nth-child(4)::before { content: "🐋"; }

    /* author badge (classical roman/greek style) */
    .books li::after {
        content: attr(data-author);
        font-size: 0.75rem;
        font-weight: 500;
        background: #e7dcc8;
        padding: 0.25rem 1rem;
        border-radius: 40px;
        color: #735f42;
        font-family: "Courier New", monospace;
        letter-spacing: 0.3px;
        border: 1px solid #dabd90;
        white-space: nowrap;
    }

    /* data-author mapping to classical masters */
    .books li:nth-child(1)::after { content: "Homer — Ἰλιάς"; }
    .books li:nth-child(2)::after { content: "Marcus Aurelius — Imperator"; }
    .books li:nth-child(3)::after { content: "Jane Austen — wit & elegance"; }
    .books li:nth-child(4)::after { content: "Herman Melville — the deep"; }

    /* hover: golden touch */
    .books li:hover {
        transform: translateX(8px) scale(1.01);
        background: #fffef6;
        border-left-color: #e7b15d;
        box-shadow: 0 6px 12px rgba(90, 65, 35, 0.12);
    }

    .books li:hover::before {
        opacity: 1;
        transform: translateY(-50%) scale(1.08);
        filter: drop-shadow(0 0 2px #ca9e60);
    }

    /* footer: classical Roman archway button */
    footer {
        text-align: center;
        margin-top: 2.2rem;
        position: relative;
    }

    .back {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: #3d3527;
        color: #fef0db;
        text-decoration: none;
        font-size: 1.05rem;
        font-weight: 600;
        padding: 0.7rem 2rem;
        border-radius: 40px 12px 40px 12px;
        transition: all 0.3s ease;
        letter-spacing: 1px;
        border: 1px solid #dbb073;
        box-shadow: 0 5px 12px rgba(0,0,0,0.2);
        font-family: "Cormorant Garamond", serif;
    }

    .back:hover {
        background: #5b4a32;
        transform: translateY(-2px);
        gap: 18px;
        border-radius: 12px 40px 12px 40px;
        border-color: #f5cd95;
        box-shadow: 0 8px 18px rgba(0,0,0,0.3);
    }

    /* classical meander (greek key) decoration on library sides */
    .books ul::before {
        content: "⚜️ 𓍯 𓂀 ⚜️";
        position: absolute;
        top: -28px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.85rem;
        opacity: 0.5;
        letter-spacing: 4px;
        white-space: nowrap;
        font-family: monospace;
        background: #f3e9d7;
        padding: 0.1rem 1rem;
        border-radius: 100px;
        pointer-events: none;
    }

    /* decorative laurel branch in footer */
    footer::before {
        content: "✧ laurel crown ✧";
        position: absolute;
        top: -30px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.7rem;
        background: #e7d7bb;
        padding: 0.1rem 1rem;
        border-radius: 30px;
        color: #a47e4a;
        letter-spacing: 1px;
        white-space: nowrap;
        font-family: monospace;
        opacity: 0.6;
    }

    /* classical column fluting effect on hover over .library */
    @keyframes marbleShimmer {
        0% { background-position: 0% 0%; }
        100% { background-position: 100% 0%; }
    }

    .library {
        background-size: 200% 100%;
        animation: marbleShimmer 12s infinite alternate ease-in-out;
    }

    /* responsive — eternal elegance */
    @media (max-width: 620px) {
        .library {
            padding: 1.4rem;
        }
        .header h1 {
            font-size: 2.1rem;
        }
        .header h1::before, .header h1::after {
            font-size: 1.4rem;
            left: -35px;
            right: -35px;
        }
        .books li {
            font-size: 1.08rem;
            padding: 0.7rem 0.7rem 0.7rem 2.2rem;
        }
        .books li::after {
            font-size: 0.6rem;
            white-space: normal;
        }
        .books ul::before {
            font-size: 0.65rem;
            white-space: nowrap;
        }
        footer::before {
            font-size: 0.55rem;
            white-space: nowrap;
        }
        .back {
            padding: 0.5rem 1.2rem;
        }
    }

    /* subtle shadow animation on list items */
    .books li:active {
        transform: scale(0.99);
        transition: 0.05s;
    }

    /* custom scrollbar — marble style */
    ::-webkit-scrollbar {
        width: 8px;
        background: #2d241b;
    }
    ::-webkit-scrollbar-thumb {
        background: #bd9a64;
        border-radius: 20px;
    }
</style>
<title>Elysian Classics | Marble Hall of Wisdom</title>
</head>
<body>

<div class="library">

    <div class="header">
        <h1>🏛️ Elysian Classics</h1>
        <p>Foundations of timeless thought</p>
    </div>

    <div class="books">
        <ul>
            <li data-author="Homer">The Iliad</li>
            <li data-author="Marcus Aurelius">Meditations</li>
            <li data-author="Jane Austen">Pride and Prejudice</li>
            <li data-author="Herman Melville">Moby-Dick</li>
        </ul>
    </div>

    <footer>
        <a href="Index.html" class="back">← Back to Library</a>
    </footer>

</div>

</body>
</html>
