<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modernist Masterpieces | Fractured Light & Stream of Vision</title>
    <style>
        /* --------------------------------------------
           MODERNIST MASTERPIECES — Avant-Garde, Fragmented, Bold
           Geometric abstraction, bold contrasts, experimental typography
        -------------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #1e1a16, #0b0907);
            font-family: "Cormorant Garamond", "Georgia", "Times New Roman", serif;
            color: #1e1912;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
        }

        /* deconstructivist background — diagonal fragments */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(45deg, 
                rgba(180, 140, 90, 0.04) 0px, 
                rgba(180, 140, 90, 0.04) 2px,
                transparent 2px,
                transparent 18px),
                repeating-linear-gradient(-45deg,
                rgba(100, 70, 40, 0.03) 0px,
                rgba(100, 70, 40, 0.03) 1px,
                transparent 1px,
                transparent 24px);
            pointer-events: none;
            z-index: 0;
        }

        /* floating abstract shapes / fragmented letters */
        body::after {
            content: "◻ ◼ ▲ ▼ ◆ ◇ ○ ● □ ■ △ ▷ ◁";
            position: fixed;
            top: 20%;
            right: -100px;
            font-size: 68px;
            white-space: nowrap;
            color: rgba(200, 150, 80, 0.06);
            pointer-events: none;
            animation: driftAbstract 42s infinite linear;
            z-index: 0;
            font-family: monospace;
        }

        @keyframes driftAbstract {
            0% { transform: translateX(-15%) rotate(0deg); opacity: 0.08; }
            50% { transform: translateX(35%) rotate(6deg); opacity: 0.15; }
            100% { transform: translateX(85%) rotate(-3deg); opacity: 0.08; }
        }

        /* main library — Bauhaus / modernist collage */
        .library {
            position: relative;
            z-index: 10;
            max-width: 740px;
            width: 100%;
            margin: 0 auto;
            background: #fdf5e6;
            background-image: linear-gradient(110deg, #fef7ea 0%, #f5ecdb 100%);
            border-radius: 16px 48px 16px 48px;
            box-shadow: 20px 20px 0px -5px rgba(0,0,0,0.2),
                        0 0 0 1px #ddceb2 inset,
                        0 0 0 5px #b18b58 inset,
                        0 0 0 10px #e7d7bc inset;
            padding: 2.2rem 2rem 2.2rem 2rem;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.2);
            transform: rotate(-0.3deg);
        }

        .library:hover {
            transform: rotate(0.2deg) translateY(-5px);
            box-shadow: 24px 24px 0px -8px rgba(0,0,0,0.3);
        }

        /* modernist geometric decorations */
        .library::before {
            content: "◆";
            position: absolute;
            top: -18px;
            left: 20px;
            font-size: 2rem;
            opacity: 0.5;
            color: #b47c44;
            transform: rotate(45deg);
            pointer-events: none;
        }

        .library::after {
            content: "◼";
            position: absolute;
            bottom: -20px;
            right: 25px;
            font-size: 2rem;
            opacity: 0.45;
            color: #9e6f3e;
            pointer-events: none;
        }

        /* Header — fragmented yet bold */
        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 0.8rem;
            border-bottom: 3px solid #dcc088;
            position: relative;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(125deg, #4d3620, #c48a4a, #6b4a2a, #e09d58);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            display: inline-block;
            font-family: "Cormorant Garamond", "Georgia", serif;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.05);
            position: relative;
        }

        /* avant-garde punctuation */
        .header h1::before {
            content: "⚡";
            font-size: 1.8rem;
            position: absolute;
            left: -55px;
            top: -2px;
            opacity: 0.65;
            transform: rotate(-10deg);
        }

        .header h1::after {
            content: "✧";
            font-size: 2rem;
            position: absolute;
            right: -55px;
            top: -2px;
            opacity: 0.65;
            transform: rotate(10deg);
        }

        .header p {
            font-size: 1.1rem;
            font-style: italic;
            color: #8b6944;
            background: rgba(210, 180, 130, 0.25);
            display: inline-block;
            padding: 0.25rem 2rem;
            border-radius: 30px 8px 30px 8px;
            margin-top: 0.7rem;
            backdrop-filter: blur(2px);
            border-left: 2px solid #dbb066;
            border-right: 2px solid #dbb066;
            letter-spacing: 0.3px;
        }

        /* BOOKS — experimental, fragmented blocks */
        .books {
            margin: 2rem 0 2rem;
            position: relative;
        }

        .books ul {
            list-style: none;
            padding: 0.6rem 0.3rem;
            background: #fffef5;
            border-radius: 12px 32px 12px 32px;
            box-shadow: inset 0 0 0 1px #f3e8d6, 0 8px 20px rgba(0,0,0,0.06);
        }

        .books li {
            font-size: 1.32rem;
            padding: 0.9rem 1rem 0.9rem 3rem;
            margin: 0.7rem 1rem;
            background: #fffffc;
            border-radius: 8px 30px 8px 30px;
            font-weight: 600;
            color: #2f2419;
            transition: all 0.25s ease;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.7rem;
            box-shadow: 0 1px 5px rgba(0,0,0,0.04), inset 0 1px 0 #fffcf5;
            border-left: 5px solid #c48647;
            cursor: pointer;
            position: relative;
        }

        /* abstract modernist icons */
        .books li::before {
            content: "◈";
            font-size: 1.2rem;
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.7;
            transition: 0.2s;
        }

        .books li:nth-child(1)::before { content: "🌀"; font-size: 1.2rem; }
        .books li:nth-child(2)::before { content: "⛲"; }
        .books li:nth-child(3)::before { content: "🏮"; }
        .books li:nth-child(4)::before { content: "🪳"; }

        /* author badge — sharp, modernist typography */
        .books li::after {
            content: attr(data-author);
            font-size: 0.7rem;
            font-weight: 600;
            background: #f0e4d0;
            padding: 0.2rem 1rem;
            border-radius: 12px 24px 12px 24px;
            color: #9a6a3c;
            font-family: "Courier New", monospace;
            letter-spacing: 0.2px;
            border: 1px solid #e2c694;
            white-space: nowrap;
            text-transform: uppercase;
            font-size: 0.65rem;
        }

        .books li:nth-child(1)::after { content: "J. JOYCE — stream of consciousness"; }
        .books li:nth-child(2)::after { content: "T.S. ELIOT — fragments"; }
        .books li:nth-child(3)::after { content: "V. WOOLF — lighthouse"; }
        .books li:nth-child(4)::after { content: "F. KAFKA — metamorphosis"; }

        /* hover: dynamic shift, avant-garde disruption */
        .books li:hover {
            transform: translateX(6px) scale(1.01);
            background: #fffef7;
            border-left-color: #e5a35c;
            box-shadow: 0 6px 14px rgba(80, 50, 20, 0.12);
        }

        .books li:hover::before {
            opacity: 1;
            transform: translateY(-50%) scale(1.15) rotate(12deg);
        }

        /* footer — constructivist button */
        footer {
            text-align: center;
            margin-top: 2rem;
            position: relative;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #3d2f22;
            color: #f8edd9;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.7rem 2rem;
            border-radius: 8px 28px 8px 28px;
            transition: all 0.3s;
            letter-spacing: 1px;
            border: 1px solid #dcac70;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.2);
            font-family: "Cormorant Garamond", monospace;
        }

        .back:hover {
            background: #604a34;
            transform: translate(-2px, -2px);
            gap: 18px;
            border-radius: 28px 8px 28px 8px;
            border-color: #f7cb8e;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.25);
        }

        /* deconstructivist ribbon */
        .books ul::before {
            content: "❚❙ FRAGMENTED CANON ❙❚";
            position: absolute;
            top: -36px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            background: #f2e4cf;
            padding: 0.2rem 1rem;
            border-radius: 4px 20px 4px 20px;
            color: #bf8045;
            font-family: monospace;
            letter-spacing: 2px;
            white-space: nowrap;
            opacity: 0.8;
            pointer-events: none;
            font-weight: bold;
        }

        /* footer abstract emblem */
        footer::before {
            content: "⬚ ◻ ⬚";
            position: absolute;
            bottom: 45px;
            right: -5px;
            font-size: 0.8rem;
            background: #ebddc5;
            padding: 0.1rem 0.6rem;
            border-radius: 4px;
            color: #b68148;
            transform: skewX(-8deg);
            opacity: 0.6;
            font-family: monospace;
        }

        /* subtle animated scan (modernist interference) */
        @keyframes staticGlitch {
            0% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        .library {
            animation: staticGlitch 4s infinite alternate;
        }

        /* responsive adaptation */
        @media (max-width: 640px) {
            .library {
                padding: 1.4rem;
            }
            .header h1 {
                font-size: 2rem;
            }
            .header h1::before, .header h1::after {
                font-size: 1.3rem;
                left: -32px;
                right: -32px;
            }
            .books li {
                font-size: 1rem;
                padding: 0.7rem 0.7rem 0.7rem 2.2rem;
            }
            .books li::after {
                font-size: 0.55rem;
                white-space: normal;
            }
            .books ul::before {
                font-size: 0.5rem;
                white-space: nowrap;
                letter-spacing: 1px;
            }
            footer::before {
                display: none;
            }
            .back {
                padding: 0.5rem 1.2rem;
            }
        }

        .books li:active {
            transform: scale(0.98);
        }

        ::-webkit-scrollbar {
            width: 6px;
            background: #241e16;
        }
        ::-webkit-scrollbar-thumb {
            background: #bf884d;
            border-radius: 0px;
        }

        .back:hover::after {
            content: " ◇";
            font-size: 0.9rem;
        }
        .back::after {
            transition: 0.2s;
        }
    </style>
</head>
<body>
<div class="library">

    <div class="header">
        <h1>🎨 Modernist Masterpieces</h1>
        <p>Foundations of timeless thought</p>
    </div>

    <div class="books">
        <ul>
            <li data-author="James Joyce">Ulysses</li>
            <li data-author="T.S. Eliot">The Waste Land</li>
            <li data-author="Virginia Woolf">To the Lighthouse</li>
            <li data-author="Franz Kafka">The Metamorphosis</li>
        </ul>
    </div>

    <footer>
        <a href="index.html" class="back">← Back to Library</a>
    </footer>

</div>
</body>
</html>
